# Catfish Feeder — firmware CI, GitHub Pages web flasher, releases
#
# - Builds both PlatformIO projects (display-unit ESP32-S3, relay-unit ESP8266)
# - Display unit: pioarduino emits firmware.factory.bin — a single flashable
#   image (bootloader @0x0, partitions @0x8000, boot_app0 @0xe000, app @0x10000,
#   DIO flash mode) used directly by the web flasher.
# - Relay unit: espressif8266 produces a self-contained firmware.bin flashed at 0x0.
# - Serves web-flasher/ + fresh firmware manifests on GitHub Pages (build_type=workflow)
# - Attaches firmware binaries to GitHub releases on v* tags
#
# Permissions are least-privilege per job; PR runs get a read-only token.

name: Firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# One build per ref; PR builds cancel superseded runs, main/tag runs never do.
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-native:
    name: Native unit tests (feed_scheduler)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO (pinned for reproducible builds)
        run: pip install platformio==6.2.0

      - name: Run native tests
        run: pio test -d firmware/display-unit -e native

  build-display-unit:
    name: Build Display Unit (ESP32-S3)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO (pinned for reproducible builds)
        run: pip install platformio==6.2.0

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-display-unit-${{ runner.os }}-${{ hashFiles('firmware/display-unit/platformio.ini') }}
          restore-keys: |
            pio-display-unit-${{ runner.os }}-

      - name: Build firmware
        run: pio run -d firmware/display-unit

      - name: Firmware size report
        run: |
          pio run -d firmware/display-unit -t size 2>&1 | tee size.log
          {
            echo "### Display Unit (ESP32-S3) firmware size"
            echo '```'
            grep -E '^(RAM|Flash):' size.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage binaries
        run: |
          mkdir -p staging
          # firmware.factory.bin = merged single image for the web flasher
          cp firmware/display-unit/.pio/build/display-unit/firmware.factory.bin staging/
          cp firmware/display-unit/.pio/build/display-unit/firmware.bin staging/
          cp firmware/display-unit/.pio/build/display-unit/bootloader.bin staging/
          cp firmware/display-unit/.pio/build/display-unit/partitions.bin staging/
          # ELF for symbolized crash triage (release asset only)
          cp firmware/display-unit/.pio/build/display-unit/firmware.elf staging/

      - name: Upload display-unit artifact
        uses: actions/upload-artifact@v4
        with:
          name: fw-display-unit-${{ github.sha }}
          path: staging/*
          if-no-files-found: error

  build-relay-unit:
    name: Build Relay Unit (ESP8266)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO (pinned for reproducible builds)
        run: pip install platformio==6.2.0

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-relay-unit-${{ runner.os }}-${{ hashFiles('firmware/relay-unit/platformio.ini') }}
          restore-keys: |
            pio-relay-unit-${{ runner.os }}-

      - name: Build firmware
        run: pio run -d firmware/relay-unit

      - name: Firmware size report
        run: |
          pio run -d firmware/relay-unit -t size 2>&1 | tee size.log
          {
            echo "### Relay Unit (ESP8266) firmware size"
            echo '```'
            grep -E '^(RAM|Flash):' size.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # espressif8266 uploads a self-contained firmware.bin at offset 0x0,
      # so the web flasher needs a single part at 0.
      - name: Stage binaries
        run: |
          mkdir -p staging
          cp firmware/relay-unit/.pio/build/relay-unit/firmware.bin staging/relay-unit-firmware.bin
          # ELF for symbolized crash triage (release asset only)
          cp firmware/relay-unit/.pio/build/relay-unit/firmware.elf staging/relay-unit-firmware.elf

      - name: Upload relay-unit artifact
        uses: actions/upload-artifact@v4
        with:
          name: fw-relay-unit-${{ github.sha }}
          path: staging/*
          if-no-files-found: error

  deploy-pages:
    name: Deploy web flasher to GitHub Pages
    needs: [build-display-unit, build-relay-unit]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download display-unit artifact
        uses: actions/download-artifact@v4
        with:
          name: fw-display-unit-${{ github.sha }}
          path: dist/display-unit

      - name: Download relay-unit artifact
        uses: actions/download-artifact@v4
        with:
          name: fw-relay-unit-${{ github.sha }}
          path: dist/relay-unit

      - name: Assemble site
        run: |
          mkdir -p site/fw
          cp web-flasher/* site/
          cp dist/display-unit/firmware.factory.bin site/fw/display-unit-merged.bin
          cp dist/relay-unit/relay-unit-firmware.bin site/fw/relay-unit-firmware.bin

      - name: Generate firmware manifests (version = short commit SHA)
        run: |
          python3 - <<'PY'
          import json
          import os

          sha = os.environ.get("GITHUB_SHA", "")
          version = sha[:7] if sha else "dev"

          def manifest(name: str, chip_family: str, part_path: str) -> dict:
              return {
                  "name": name,
                  "version": version,
                  # Show the "Erase device" checkbox in the install dialog
                  # (ESP Web Tools documented manifest key).
                  "new_install_prompt_erase": True,
                  "builds": [
                      {
                          "chipFamily": chip_family,
                          "parts": [{"path": part_path, "offset": 0}],
                      }
                  ],
              }

          with open("site/manifest-display.json", "w", encoding="utf-8") as f:
              json.dump(
                  manifest(
                      "Catfish Feeder \u2014 Display Unit",
                      "ESP32-S3",
                      "./fw/display-unit-merged.bin",
                  ),
                  f,
                  indent=2,
              )
              f.write("\n")

          with open("site/manifest-relay.json", "w", encoding="utf-8") as f:
              json.dump(
                  manifest(
                      "Catfish Feeder \u2014 Relay Unit",
                      "ESP8266",
                      "./fw/relay-unit-firmware.bin",
                  ),
                  f,
                  indent=2,
              )
              f.write("\n")

          print("wrote manifests with version", version)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Attach firmware to GitHub release
    needs: [build-display-unit, build-relay-unit]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download display-unit artifact
        uses: actions/download-artifact@v4
        with:
          name: fw-display-unit-${{ github.sha }}
          path: dist/display-unit

      - name: Download relay-unit artifact
        uses: actions/download-artifact@v4
        with:
          name: fw-relay-unit-${{ github.sha }}
          path: dist/relay-unit

      - name: Collect release assets (versioned filenames)
        run: |
          mkdir -p assets
          V="${{ github.ref_name }}"
          cp dist/display-unit/firmware.factory.bin "assets/merged-firmware-${V}.bin"
          cp dist/display-unit/firmware.bin "assets/display-unit-firmware-${V}.bin"
          cp dist/display-unit/bootloader.bin "assets/display-unit-bootloader-${V}.bin"
          cp dist/display-unit/partitions.bin "assets/display-unit-partitions-${V}.bin"
          cp dist/display-unit/firmware.elf "assets/display-unit-firmware-${V}.elf"
          cp dist/relay-unit/relay-unit-firmware.bin "assets/relay-unit-firmware-${V}.bin"
          cp dist/relay-unit/relay-unit-firmware.elf "assets/relay-unit-firmware-${V}.elf"

      - name: Attach assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
