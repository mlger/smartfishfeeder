# Catfish Feeder — firmware CI, GitHub Pages web flasher, releases
#
# - Builds both PlatformIO projects (display-unit ESP32-S3, relay-unit ESP8266)
# - Display unit: pioarduino emits firmware.factory.bin — a single flashable
#   image (bootloader @0x0, partitions @0x8000, boot_app0 @0xe000, app @0x10000,
#   DIO flash mode) used directly by the web flasher.
# - Relay unit: espressif8266 produces a self-contained firmware.bin flashed at 0x0.
# - Serves web-flasher/ + firmware manifests on GitHub Pages (build_type=workflow).
#   The flasher has a version picker: CI mirrors the web-flashable image of recent
#   releases under fw/<tag>/ and writes versions.json + per-release manifests.
#   Release downloads are NOT CORS-enabled, so binaries must live on the Pages
#   origin for ESP Web Tools to fetch them.
# - Attaches firmware binaries to GitHub releases on v* tags, and maintains a
#   rolling "latest" prerelease on every main build (so firmware is always
#   attached to a release without needing a tag)
#
# Permissions are least-privilege per job; PR runs get a read-only token.

name: Firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# One build per ref; PR builds cancel superseded runs, main/tag runs never do.
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-native:
    name: Native unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PlatformIO (pinned for reproducible builds)
        run: pip install platformio==6.2.0

      - name: Run native tests
        run: pio test -d firmware/display-unit -e native

  build-display-unit:
    name: Build Display Unit (ESP32-S3)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Release integrity: on v* tags the tag MUST equal the compiled
      # CATFISH_APP_VERSION, otherwise release assets would advertise a
      # different version than the running firmware reports (OTA/web UI).
      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          APPV=$(grep -m1 '^#define CATFISH_APP_VERSION' firmware/common/catfish_protocol.h | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG" != "$APPV" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match CATFISH_APP_VERSION '${APPV}'. Bump firmware/common/catfish_protocol.h to ${TAG} (or re-tag) so release assets carry a truthful version."
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} == app version ${APPV}: OK"

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PlatformIO (pinned for reproducible builds)
        run: pip install platformio==6.2.0

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-display-unit-${{ runner.os }}-${{ hashFiles('firmware/display-unit/platformio.ini') }}
          restore-keys: |
            pio-display-unit-${{ runner.os }}-

      - name: Build firmware
        run: pio run -d firmware/display-unit

      - name: Firmware size report
        run: |
          pio run -d firmware/display-unit -t size 2>&1 | tee size.log
          {
            echo "### Display Unit (ESP32-S3) firmware size"
            echo '```'
            grep -E '^(RAM|Flash):' size.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage binaries
        run: |
          mkdir -p staging
          # firmware.factory.bin = merged single image for the web flasher
          cp firmware/display-unit/.pio/build/display-unit/firmware.factory.bin staging/
          cp firmware/display-unit/.pio/build/display-unit/firmware.bin staging/
          cp firmware/display-unit/.pio/build/display-unit/bootloader.bin staging/
          cp firmware/display-unit/.pio/build/display-unit/partitions.bin staging/
          # ELF for symbolized crash triage (release asset only)
          cp firmware/display-unit/.pio/build/display-unit/firmware.elf staging/

      - name: Upload display-unit artifact
        uses: actions/upload-artifact@v7
        with:
          name: fw-display-unit-${{ github.sha }}
          path: staging/*
          if-no-files-found: error

  build-relay-unit:
    name: Build Relay Unit (ESP8266)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PlatformIO (pinned for reproducible builds)
        run: pip install platformio==6.2.0

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-relay-unit-${{ runner.os }}-${{ hashFiles('firmware/relay-unit/platformio.ini') }}
          restore-keys: |
            pio-relay-unit-${{ runner.os }}-

      - name: Build firmware
        run: pio run -d firmware/relay-unit

      - name: Firmware size report
        run: |
          pio run -d firmware/relay-unit -t size 2>&1 | tee size.log
          {
            echo "### Relay Unit (ESP8266) firmware size"
            echo '```'
            grep -E '^(RAM|Flash):' size.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # espressif8266 uploads a self-contained firmware.bin at offset 0x0,
      # so the web flasher needs a single part at 0.
      - name: Stage binaries
        run: |
          mkdir -p staging
          cp firmware/relay-unit/.pio/build/relay-unit/firmware.bin staging/relay-unit-firmware.bin
          # ELF for symbolized crash triage (release asset only)
          cp firmware/relay-unit/.pio/build/relay-unit/firmware.elf staging/relay-unit-firmware.elf

      - name: Upload relay-unit artifact
        uses: actions/upload-artifact@v7
        with:
          name: fw-relay-unit-${{ github.sha }}
          path: staging/*
          if-no-files-found: error

  # Boots the headless QEMU build (env:display-unit-qemu) in Espressif's
  # QEMU and runs the scripted UI-event smoke sequence. Catches boot-time
  # crashes and event-pipeline regressions without hardware (see
  # scripts/qemu_run.sh and docs/tooling.md).
  qemu-smoke:
    name: QEMU smoke test (headless display-unit boot)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PlatformIO (pinned for reproducible builds)
        run: pip install platformio==6.2.0

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-display-unit-qemu-${{ runner.os }}-${{ hashFiles('firmware/display-unit/platformio.ini') }}
          restore-keys: |
            pio-display-unit-qemu-${{ runner.os }}-

      - name: Install QEMU runtime dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libslirp0 libsdl2-2.0-0 libpixman-1-0

      - name: Download Espressif QEMU (pinned esp32s3-capable release)
        run: |
          QEMU_TAG=esp-develop-9.2.2-20260417
          curl -sL --retry 3 -o /tmp/qemu-xtensa.tar.xz \
            "https://github.com/espressif/qemu/releases/download/${QEMU_TAG}/qemu-xtensa-softmmu-esp_develop_9.2.2_20260417-x86_64-linux-gnu.tar.xz"
          mkdir -p "$HOME/tools"
          tar -xJf /tmp/qemu-xtensa.tar.xz -C "$HOME/tools"
          echo "QEMU_BIN=$HOME/tools/qemu/bin/qemu-system-xtensa" >> "$GITHUB_ENV"

      - name: Boot headless and run the UI-event smoke test
        run: scripts/qemu_run.sh

      - name: Upload serial log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: qemu-serial-log-${{ github.sha }}
          path: firmware/display-unit/.pio/build/display-unit-qemu/qemu-serial.log
          if-no-files-found: ignore

  deploy-pages:
    name: Deploy web flasher to GitHub Pages
    needs: [build-display-unit, build-relay-unit, qemu-smoke]
    # main pushes keep the rolling dev image fresh; v* tag pushes refresh the
    # release mirror immediately after a release is published.
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download display-unit artifact
        uses: actions/download-artifact@v8
        with:
          name: fw-display-unit-${{ github.sha }}
          path: dist/display-unit

      - name: Download relay-unit artifact
        uses: actions/download-artifact@v8
        with:
          name: fw-relay-unit-${{ github.sha }}
          path: dist/relay-unit

      - name: Assemble site
        run: |
          mkdir -p site/fw
          cp web-flasher/* site/
          cp dist/display-unit/firmware.factory.bin site/fw/display-unit-merged.bin
          cp dist/relay-unit/relay-unit-firmware.bin site/fw/relay-unit-firmware.bin

      - name: Generate dev manifests (version = short commit SHA)
        run: |
          python3 - <<'PY'
          import json
          import os

          sha = os.environ.get("GITHUB_SHA", "")
          version = sha[:7] if sha else "dev"

          def manifest(name: str, chip_family: str, part_path: str) -> dict:
              return {
                  "name": name,
                  "version": version,
                  # Show the "Erase device" checkbox in the install dialog
                  # (ESP Web Tools documented manifest key).
                  "new_install_prompt_erase": True,
                  "builds": [
                      {
                          "chipFamily": chip_family,
                          "parts": [{"path": part_path, "offset": 0}],
                      }
                  ],
              }

          with open("site/manifest-display.json", "w", encoding="utf-8") as f:
              json.dump(
                  manifest(
                      "Catfish Feeder \u2014 Display Unit",
                      "ESP32-S3",
                      "./fw/display-unit-merged.bin",
                  ),
                  f,
                  indent=2,
              )
              f.write("\n")

          with open("site/manifest-relay.json", "w", encoding="utf-8") as f:
              json.dump(
                  manifest(
                      "Catfish Feeder \u2014 Relay Unit",
                      "ESP8266",
                      "./fw/relay-unit-firmware.bin",
                  ),
                  f,
                  indent=2,
              )
              f.write("\n")

          print("wrote manifests with version", version)
          PY

      # Mirror the web-flashable image of recent GitHub releases under
      # site/fw/<tag>/ and index them in versions.json for the flasher's
      # version picker. The site-local fw/ copy (dev manifests above) stays
      # as a fallback when the release list is unavailable.
      - name: Mirror release firmware for the version picker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import time
          import urllib.request

          REPO = os.environ["GITHUB_REPOSITORY"]
          TOKEN = os.environ.get("GH_TOKEN", "")
          REF_NAME = os.environ.get("GITHUB_REF_NAME", "")
          REF_TYPE = os.environ.get("GITHUB_REF_TYPE", "")
          SITE = pathlib.Path("site")
          MAX_STABLE = 10  # mirror cap — keeps the Pages artifact bounded
          API = f"https://api.github.com/repos/{REPO}/releases?per_page=30"

          def gh_json(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {TOKEN}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "catfish-pages-mirror",
              })
              with urllib.request.urlopen(req, timeout=60) as resp:
                  return json.loads(resp.read().decode("utf-8"))

          def download(url, dest):
              # No auth header here: browser_download_url 302s to a signed
              # release-assets URL and forwarding Authorization cross-host fails.
              dest.parent.mkdir(parents=True, exist_ok=True)
              req = urllib.request.Request(url, headers={"User-Agent": "catfish-pages-mirror"})
              with urllib.request.urlopen(req, timeout=600) as resp:
                  data = resp.read()
              dest.write_bytes(data)
              return len(data)

          def pick(assets, kind):
              """Choose the web-flashable binary for one unit from a release."""
              if kind == "display":
                  prefixes = ("merged-firmware-", "catfish-display-unit-latest.")
                  banned = ("-app-", "-bootloader-", "-partitions-")
              else:
                  prefixes = ("relay-unit-firmware-", "catfish-relay-unit-latest.")
                  banned = ()
              for prefix in prefixes:
                  for asset in assets:
                      name = asset["name"]
                      if (name.startswith(prefix) and name.endswith(".bin")
                              and not any(b in name for b in banned)):
                          return asset
              return None

          def manifest(name, version, chip, part):
              return {
                  "name": name,
                  "version": version,
                  "new_install_prompt_erase": True,
                  "builds": [{"chipFamily": chip, "parts": [{"path": part, "offset": 0}]}],
              }

          def write_json(path, payload):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")

          def fetch_releases():
              """List releases; on a v* tag push the release job attaches assets
              concurrently, so poll briefly until this tag's release is usable."""
              deadline = time.monotonic() + 300 if REF_TYPE == "tag" else time.monotonic()
              while True:
                  try:
                      rels = gh_json(API)
                  except Exception as exc:
                      if time.monotonic() < deadline:
                          time.sleep(20)
                          continue
                      print(f"::warning::GitHub release list unavailable ({exc})")
                      return None
                  if REF_TYPE != "tag":
                      return rels
                  rel = next((r for r in rels if r.get("tag_name") == REF_NAME), None)
                  if rel and pick(rel.get("assets", []), "display") and pick(rel.get("assets", []), "relay"):
                      return rels
                  if time.monotonic() >= deadline:
                      print(f"::warning::release {REF_NAME} not usable yet; mirroring what exists")
                      return rels
                  time.sleep(20)

          releases = fetch_releases()
          entries = []
          skipped = []
          stable_mirrored = 0
          if releases:
              for rel in releases:
                  tag = rel.get("tag_name", "")
                  if rel.get("draft") or not tag or not all(c.isalnum() or c in ".-_" for c in tag):
                      skipped.append((tag or "?", "draft or unsafe tag name"))
                      continue
                  rolling = tag == "latest"
                  if not rolling and stable_mirrored >= MAX_STABLE:
                      continue
                  disp = pick(rel.get("assets", []), "display")
                  relay = pick(rel.get("assets", []), "relay")
                  if disp is None or relay is None:
                      skipped.append((tag, "missing web-flashable asset"))
                      continue
                  fwdir = SITE / "fw" / tag
                  try:
                      dsize = download(disp["browser_download_url"], fwdir / "display-unit-merged.bin")
                      rsize = download(relay["browser_download_url"], fwdir / "relay-unit-firmware.bin")
                  except Exception as exc:
                      skipped.append((tag, f"download failed ({exc})"))
                      continue
                  write_json(SITE / f"manifest-display-{tag}.json",
                             manifest(f"Catfish Feeder \u2014 Display Unit {tag}", tag,
                                      "ESP32-S3", f"./fw/{tag}/display-unit-merged.bin"))
                  write_json(SITE / f"manifest-relay-{tag}.json",
                             manifest(f"Catfish Feeder \u2014 Relay Unit {tag}", tag,
                                      "ESP8266", f"./fw/{tag}/relay-unit-firmware.bin"))
                  entries.append({
                      "tag": tag,
                      "label": f"{tag} (rolling main build)" if rolling else tag,
                      "stable": not rel.get("prerelease", False),
                      "rolling": rolling,
                      "publishedAt": rel.get("published_at", ""),
                      "displayManifest": f"manifest-display-{tag}.json",
                      "relayManifest": f"manifest-relay-{tag}.json",
                  })
                  if not rolling:
                      stable_mirrored += 1
                  print(f"mirrored {tag}: display {dsize} bytes, relay {rsize} bytes")

          # Rolling latest goes last so the newest stable release is the default pick.
          entries.sort(key=lambda e: e["rolling"])
          write_json(SITE / "versions.json", {
              "generatedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "repo": REPO,
              "versions": entries,
          })
          print(f"versions.json written with {len(entries)} selectable versions")
          for tag, why in skipped:
              print(f"  skipped {tag}: {why}")

          summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if summary and entries:
              rows = "\n".join(
                  f"| `{e['tag']}` | {'stable' if e['stable'] else 'rolling'} |" for e in entries)
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("\n### Web flasher version picker\n\n| Tag | Channel |\n|---|---|\n"
                           + rows + "\n")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Attach firmware to GitHub release
    needs: [build-display-unit, build-relay-unit, qemu-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download display-unit artifact
        uses: actions/download-artifact@v8
        with:
          name: fw-display-unit-${{ github.sha }}
          path: dist/display-unit

      - name: Download relay-unit artifact
        uses: actions/download-artifact@v8
        with:
          name: fw-relay-unit-${{ github.sha }}
          path: dist/relay-unit

      - name: Collect release assets (versioned filenames)
        run: |
          mkdir -p assets
          V="${{ github.ref_name }}"
          cp dist/display-unit/firmware.factory.bin "assets/merged-firmware-${V}.bin"
          cp dist/display-unit/firmware.bin "assets/display-unit-firmware-${V}.bin"
          cp dist/display-unit/bootloader.bin "assets/display-unit-bootloader-${V}.bin"
          cp dist/display-unit/partitions.bin "assets/display-unit-partitions-${V}.bin"
          cp dist/display-unit/firmware.elf "assets/display-unit-firmware-${V}.elf"
          cp dist/relay-unit/relay-unit-firmware.bin "assets/relay-unit-firmware-${V}.bin"
          cp dist/relay-unit/relay-unit-firmware.elf "assets/relay-unit-firmware-${V}.elf"

      - name: Generate SHA256 checksums
        run: cd assets && sha256sum *.bin *.elf > SHA256SUMS.txt

      - name: Attach assets to release
        uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Firmware for Catfish Feeder **${{ github.ref_name }}**.

            | Unit | Image | Flash at |
            |---|---|---|
            | Display unit (ESP32-S3, 16 MB) | `merged-firmware-${{ github.ref_name }}.bin` (single merged image) | `0x0` — or one-click via the [web flasher](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/) |
            | Display unit (app only, OTA) | `display-unit-firmware-${{ github.ref_name }}.bin` | `0x10000` |
            | Relay unit (ESP8266, NodeMCU V3) | `relay-unit-firmware-${{ github.ref_name }}.bin` (self-contained) | `0x0` |

            Display unit split images (only for manual esptool workflows):
            `display-unit-bootloader-${{ github.ref_name }}.bin` @ `0x0`,
            `display-unit-partitions-${{ github.ref_name }}.bin` @ `0x8000`,
            app @ `0x10000` (boot_app0 @ `0xe000` is not needed with the merged image).

            `.elf` files are for symbolized crash triage; `SHA256SUMS.txt` covers all assets.
            The running firmware reports this release as app version `${{ github.ref_name }}` over MQTT / dashboard / OTA.

  # Rolling prerelease so firmware is always attached to a release without
  # needing a v* tag. Stable asset names + delete/recreate: the release always
  # reflects the newest main build and download URLs never change (per-sha
  # names would accumulate stale assets on every push).
  release-latest:
    name: Publish rolling latest firmware prerelease
    needs: [build-display-unit, build-relay-unit, qemu-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout (for app version string)
        uses: actions/checkout@v7

      - name: Download display-unit artifact
        uses: actions/download-artifact@v8
        with:
          name: fw-display-unit-${{ github.sha }}
          path: dist/display-unit

      - name: Download relay-unit artifact
        uses: actions/download-artifact@v8
        with:
          name: fw-relay-unit-${{ github.sha }}
          path: dist/relay-unit

      - name: Collect assets (stable latest names)
        run: |
          mkdir -p assets
          cp dist/display-unit/firmware.factory.bin  assets/catfish-display-unit-latest.bin
          cp dist/display-unit/firmware.bin          assets/catfish-display-unit-app-latest.bin
          cp dist/display-unit/bootloader.bin        assets/catfish-display-unit-bootloader-latest.bin
          cp dist/display-unit/partitions.bin        assets/catfish-display-unit-partitions-latest.bin
          cp dist/display-unit/firmware.elf          assets/catfish-display-unit-latest.elf
          cp dist/relay-unit/relay-unit-firmware.bin assets/catfish-relay-unit-latest.bin
          cp dist/relay-unit/relay-unit-firmware.elf assets/catfish-relay-unit-latest.elf
          (cd assets && sha256sum *.bin *.elf > SHA256SUMS.txt)

      - name: Publish/update the latest prerelease
        run: |
          SHA="${GITHUB_SHA::7}"
          APPV=$(grep -m1 '^#define CATFISH_APP_VERSION' firmware/common/catfish_protocol.h | sed 's/.*"\(.*\)".*/\1/')
          NOTES=$(printf 'Rolling firmware build from `main` @ %s (app v%s).\n\nProduced automatically on every main build — these are the same images the [web flasher](https://%s.github.io/%s/) serves. For tagged releases, see the `v*` releases.' "$SHA" "$APPV" "$GITHUB_REPOSITORY_OWNER" "${GITHUB_REPOSITORY#*/}")
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest assets/* \
            --prerelease \
            --title "Firmware — rolling latest" \
            --notes "$NOTES"
