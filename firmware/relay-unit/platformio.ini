; Catfish Feeder - Relay Unit
; Hardware: ESP8266 NodeMCU V3 + generic 5V 1-channel optocoupler relay module
; Drives the feeder motor (5V DC auger/roller) via relay pulse.
; Framework: Arduino (ESP8266 core 3.x)

[platformio]
default_envs = relay-unit

[env:relay-unit]
platform = espressif8266@^4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -Wno-deprecated-declarations
    -I ../common

lib_deps =
    bblanchon/ArduinoJson@^7.4.2
    tzapu/WiFiManager@^2.0.17
