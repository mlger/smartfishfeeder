; Catfish Feeder - Display Unit
; Hardware: Waveshare ESP32-S3-Touch-LCD-4.3B (ESP32-S3-WROOM-1-N16R8,
;           4.3" 800x480 RGB565 ST7262 + GT911 touch + CH422G IO expander)
; Framework: Arduino (core 3.x / ESP-IDF 5.5) via pioarduino platform
; Board config + LVGL port files are vendor-verified against Waveshare's
; official 4.3B demo package (see docs/notes/hardware-4.3b.md).

[platformio]
default_envs = display-unit

[env:display-unit]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 = 16MB QIO flash + 8MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -DCATFISH_APP_VERSION=\"1.0.0\"
    -I include

monitor_filters = esp32_exception_decoder

lib_deps =
    lvgl/lvgl@8.4.0
    bblanchon/ArduinoJson@^7.4.2
    tzapu/WiFiManager@^2.0.17
; ESP32_Display_Panel 1.0.0, ESP32_IO_Expander 1.0.1, esp-lib-utils 0.1.2
; are vendored in lib/ (exact versions from Waveshare's 4.3B demo package).
