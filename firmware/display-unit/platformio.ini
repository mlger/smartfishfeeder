; Catfish Feeder - Display Unit
; Hardware: Waveshare ESP32-S3-Touch-LCD-4.3B (ESP32-S3-WROOM-1-N16R8,
;           4.3" 800x480 RGB565 ST7262 + GT911 touch + CH422G IO expander)
; Framework: Arduino (core 3.x / ESP-IDF 5.5) via pioarduino platform
; Board config + LVGL port files are vendor-verified against Waveshare's
; official 4.3B demo package (see docs/notes/hardware-4.3b.md).

[platformio]
default_envs = display-unit

; Shared build flags (custom section so both hardware and QEMU envs can
; interpolate without env-name reference quirks).
[display_unit_flags]
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    ; Optional microSD feed log (v1.7.0) — remove this line to build without SD
    -DCATFISH_FEATURE_SD=1
    ; Optional wireless feed nodes (v1.8.0) — remove a line to disable that radio
    -DCATFISH_FEATURE_ESPNOW=1
    -DCATFISH_FEATURE_NRF24=1
    ; LCD pixel clock (v1.6.1): lower to 12000000/8000000 if the panel flickers
    ; -DCATFISH_LCD_PCLK_HZ=16000000
    ; CATFISH_APP_VERSION comes from ../common/catfish_protocol.h (single source)
    -I include
    -I ../common

[env:display-unit]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 = 16MB QIO flash + 8MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200
upload_speed = 921600

build_flags = ${display_unit_flags.build_flags}

monitor_filters = esp32_exception_decoder

; regenerate src/dashboard_html.h from dashboard/index.html when stale
extra_scripts = pre:../../scripts/embed_dashboard.py

lib_deps =
    lvgl/lvgl@8.4.0
    bblanchon/ArduinoJson@7.4.2
    tzapu/WiFiManager@2.0.17
    bertmelis/espMqttClient@1.7.3
    nrf24/RF24@1.4.8
; ESP32_Display_Panel 1.0.0, ESP32_IO_Expander 1.0.1, esp-lib-utils 0.1.2
; are vendored in lib/ (exact versions from Waveshare's 4.3B demo package).

; ---------------------------------------------------------------------------
; Headless QEMU build (test tooling only — never flash this to hardware).
; Same application code as display-unit, but the emulator has no panel /
; touch / RTC / SD / nRF24 / WiFi radio:
;   - Board::init()/begin() and the radio/SD/RTC starts are skipped
;   - LVGL renders into a RAM framebuffer (full UI object tree still runs)
;   - a fixed wall clock is injected so scheduler/countdown paths are live
;   - loop() pumps a scripted UiEvent smoke test ([QEMU] PASS/FAIL markers)
; Boot it with scripts/qemu_run.sh (Espressif QEMU, esp32s3 machine) or via
; the CI "QEMU smoke test" job. See docs/tooling.md.
; ---------------------------------------------------------------------------
[env:display-unit-qemu]
extends = env:display-unit
build_flags =
    ${display_unit_flags.build_flags}
    -DCATFISH_QEMU=1

; Host-side unit tests for feed_scheduler + mqtt_payloads (run: pio test -d . -e native)
[env:native]
platform = native
test_framework = unity
build_flags =
    -DARDUINOJSON_ENABLE_STD_STRING=1
    -I test/mocks
    -I ../common
lib_deps =
    bblanchon/ArduinoJson@7.4.2
build_src_filter = -<*>
